name: 네이버 블로그 인증 사례 자동 연동
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 블로그 RSS에서 인증 사례 추출
        run: python scripts/sync_blog_cases.py
      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog_cases.json certificate_candidates.json approved_certificate_posts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified certification cases and candidates"
            git push
          fi
