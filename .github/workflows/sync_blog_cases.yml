name: 네이버 블로그 인증 사례 자동 연동
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 인증서 이미지 글자 인식 준비
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
          python -m pip install --disable-pip-version-check pillow pytesseract
      - name: 블로그 RSS에서 인증서 이미지 자동 확인
        run: python scripts/sync_blog_cases.py
      - name: 변경된 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog_cases.json certificate_candidates.json
          if ! git diff --cached --quiet; then
            git commit -m "Update automatically detected certification cases"
            git push
          fi
