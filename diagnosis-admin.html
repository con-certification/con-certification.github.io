<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>자가진단 검토 내역 | 주식회사 시온 관리자</title><style>body{margin:0;background:#f5f8fc;color:#172b45;font:15px Arial,'Malgun Gothic',sans-serif}main{max-width:1100px;margin:45px auto;padding:0 18px}h1{font-size:27px}.card{background:white;border:1px solid #dce6f0;border-radius:15px;padding:24px;margin:16px 0}input,button{padding:12px;border:1px solid #cbd6e3;border-radius:8px;font:inherit}input{max-width:100%;box-sizing:border-box}button{background:#0969da;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:12px 0 5px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e2e8f0;padding:12px 9px;vertical-align:top;overflow-wrap:anywhere}th{background:#f2f6fc}.scroll{overflow-x:auto}.muted{color:#63758a;font-size:13px}#dashboard[hidden],#login[hidden]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}#search{width:310px}@media(max-width:600px){main{margin:20px auto}.card{padding:16px}}</style></head><body><main><h1>주식회사 시온 · 자가진단 검토 내역</h1><p class="muted">‘확인 필요’가 포함된 진단만 표시됩니다. 관리자 로그인과 데이터베이스 접근 권한이 모두 필요합니다.</p><section id="login" class="card"><h2>관리자 로그인</h2><form id="loginForm"><label for="email">관리자 이메일</label><input id="email" type="email" required autocomplete="username"><label for="password">비밀번호</label><input id="password" type="password" required autocomplete="current-password"><p><button type="submit">로그인</button></p></form></section><section id="dashboard" class="card" hidden><div class="actions"><input id="search" placeholder="제품명·용도 검색" aria-label="제품명·용도 검색"><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div><p id="count" class="muted"></p><div class="scroll"><table><thead><tr><th>진단일</th><th>제품명 / 용도</th><th>전원 / 정격</th><th>무선</th><th>EMC</th><th>전기안전</th><th>무선 인증</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">최근 500건까지 표시합니다. 수집 항목에 고객 개인정보를 포함하지 마세요.</p></section><p id="message" role="status" class="muted"></p></main><script>
const URL='https://xjpirjjhiptvnzwmiwuu.supabase.co',KEY='sb_publishable_zI2OPfJwlvdDXLBp7LqIGQ_-DZImkh3';let token='',records=[];
const $=id=>document.getElementById(id),msg=t=>$('message').textContent=t;
async function request(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),...(opts.headers||{})}});const raw=await r.text();let data;try{data=raw?JSON.parse(raw):null}catch{data=raw}if(!r.ok)throw Error(typeof data==='object'?(data.msg||data.message||data.error_description||JSON.stringify(data)):String(data));return data;}
function setLogged(ok){$('login').hidden=ok;$('dashboard').hidden=!ok;}
function draw(){const q=$('search').value.trim().toLowerCase();const filtered=records.filter(x=>(x.product_name+' '+x.purpose).toLowerCase().includes(q));$('count').textContent='조회 '+filtered.length+'건 / 최근 '+records.length+'건';$('rows').replaceChildren();for(const r of filtered){const tr=document.createElement('tr');const cols=[new Date(r.created_at).toLocaleString('ko-KR'),r.product_name+' / '+r.purpose,(r.power_modes||[]).join(', ')+' / '+(r.voltage||''),r.wireless+' / '+r.wireless_type,r.emc_status,r.safety_status,r.radio_status];for(const c of cols){const td=document.createElement('td');td.textContent=c||'';tr.append(td)}$('rows').append(tr)}}
async function load(){msg('조회 중...');try{records=await request('/rest/v1/diagnosis_reviews?select=*&order=created_at.desc&limit=500');draw();msg('조회 완료')}catch(e){msg('조회 실패: '+e.message)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('로그인 확인 중...');try{const auth=await request('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=auth.access_token;const me=await request('/auth/v1/user');if(!me?.id)throw Error('사용자 확인 실패');setLogged(true);$('password').value='';await load()}catch(e){token='';setLogged(false);msg('로그인 실패 또는 권한 없음: '+e.message)}});
$('search').addEventListener('input',draw);$('refresh').addEventListener('click',load);$('logout').addEventListener('click',()=>{token='';records=[];setLogged(false);msg('로그아웃되었습니다.')});
</script></body></html>
